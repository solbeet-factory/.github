name: Optimizacion
description: Lo mismo, mas rapido o mas barato (latencia, costo, consumo).
title: "perf: "
labels: ["type:perf", "status:triage"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema / para quien
      description: Que le pasa hoy a quien (vendedora, admin, agente, otro servicio). Sin solucion todavia.
      placeholder: "Las vendedoras de Newfly no ven en Mi dia los leads que pasaron a «urgente»..."
    validations:
      required: true
  - type: textarea
    id: research
    attributes:
      label: Research / hallazgos
      description: Que dicen los datos. Uso actual (metricas, logs, Sentry, Langfuse, chats) y lo de afuera (docs, como lo resuelven otros).
    validations:
      required: true
  - type: textarea
    id: resultado
    attributes:
      label: Resultado esperado
      description: Como se ve el sistema cuando esta hecho. Una frase por comportamiento.
    validations:
      required: true
  - type: textarea
    id: aceptacion
    attributes:
      label: Criterios de aceptacion
      description: Lista verificable. Si no se puede comprobar, no es un criterio.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: monitoreo
    attributes:
      label: Monitoreo
      description: Como sabemos si anda en produccion. Que mirar, donde y cuantos dias (la observacion post-deploy dura 7).
    validations:
      required: true
  - type: dropdown
    id: salida
    attributes:
      label: Salida
      description: Segun la criticidad. Si puede romper algo que ya se usa, flag.
      options:
        - flag — se prende por cuenta/tenant
        - gradual — por partes (sucursal, porcentaje)
        - completo — sale para todos
    validations:
      required: true
  - type: input
    id: repos
    attributes:
      label: Repos / servicios que toca
      placeholder: "IAIARS, Lia-Frontend"
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - P1 — bloquea una tarea primaria o pierde datos
        - P2 — degrada materialmente una tarea primaria
        - P3 — friccion recurrente o inconsistencia
        - P4 — detalle menor
    validations:
      required: true
  - type: dropdown
    id: tamano
    attributes:
      label: Tamano (referencia = horas de Santiago con Claude Code)
      description: XS ≤15 min · S ≤30 min · M ≤1 h · L ≤2 h · XL >2 h (partir en sub-issues antes de asignar)
      options: [XS, S, M, L, XL]
    validations:
      required: true
  - type: input
    id: eta
    attributes:
      label: ETA
      description: Fecha comprometida, si la hay (opcional).
      placeholder: "YYYY-MM-DD"
  - type: textarea
    id: contexto
    attributes:
      label: Contexto tecnico (opcional)
      description: Archivos, endpoints, tablas, links a Langfuse/Sentry, decisiones ya tomadas. Sin secretos.
