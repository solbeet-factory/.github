name: Mejora
description: Mejorar algo que ya existe (no es nuevo ni esta roto).
title: "feat: "
labels: ["type:mejora", "status:triage"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema / para quien
      description: Que le pasa hoy a quien (vendedora, admin, agente, otro servicio). Sin solucion todavia.
      placeholder: "Las vendedoras de Newfly no ven en Mi dia los leads que pasaron a «urgente»..."
    validations:
      required: true
  - type: textarea
    id: research
    attributes:
      label: Research / hallazgos
      description: Que dicen los datos. Uso actual (metricas, logs, Sentry, Langfuse, chats) y lo de afuera (docs, como lo resuelven otros).
    validations:
      required: true
  - type: textarea
    id: resultado
    attributes:
      label: Resultado esperado
      description: Como se ve el sistema cuando esta hecho. Una frase por comportamiento.
    validations:
      required: true
  - type: textarea
    id: aceptacion
    attributes:
      label: Criterios de aceptacion
      description: Lista verificable. Si no se puede comprobar, no es un criterio.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: monitoreo
    attributes:
      label: Monitoreo
      description: Como sabemos si anda en produccion. Que mirar, donde y cuantos dias (la observacion post-deploy dura 7).
    validations:
      required: true
  - type: dropdown
    id: salida
    attributes:
      label: Salida
      description: Segun la criticidad. Si puede romper algo que ya se usa, flag.
      options:
        - flag — se prende por cuenta/tenant
        - gradual — por partes (sucursal, porcentaje)
        - completo — sale para todos
    validations:
      required: true
  - type: input
    id: repos
    attributes:
      label: Repos / servicios que toca
      placeholder: "IAIARS, Lia-Frontend"
    validations:
      required: true
  - type: textarea
    id: documentacion
    attributes:
      label: Documentacion
      description: "Parte del DoD. Lo que hay que dejar al dia en el vault (KnowledgeBase) antes de cerrar. Borra las lineas que no apliquen; si no aplica nada, deja una sola con «docs: no aplica, motivo». /flujo:cerrar frena si quedan sin tildar."
      value: |
        - [ ] Vault (KnowledgeBase): `50-Agent-Context-Packs/<repo>.md` al dia — responsabilidades, endpoints y contratos, env vars (solo nombres), comandos, riesgos, y `Base:` al sha del merge
        - [ ] Si cambio un flujo entre servicios o un dominio: `10-Arquitectura/` y `30-Dominios/`; si cambio como se opera o se despliega: `40-Runbooks/`
        - [ ] Si toca IAIARS, CAIA, parlant-service o lia-quality: `agentic-os/plugin/docs/kernel.md` refleja el contrato nuevo
        - [ ] PR del vault linkeado aca
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - P1 — bloquea una tarea primaria o pierde datos
        - P2 — degrada materialmente una tarea primaria
        - P3 — friccion recurrente o inconsistencia
        - P4 — detalle menor
    validations:
      required: true
  - type: dropdown
    id: tamano
    attributes:
      label: Tamano (referencia = horas de Santiago con Claude Code)
      description: "XS ≤15 min · S ≤30 min · M ≤1 h · L ≤2 h · XL >2 h (sigue siendo un issue: decí las horas)"
      options: [XS, S, M, L, XL]
    validations:
      required: true
  - type: input
    id: eta
    attributes:
      label: ETA
      description: Fecha comprometida, si la hay (opcional).
      placeholder: "YYYY-MM-DD"
  - type: textarea
    id: contexto
    attributes:
      label: Contexto tecnico (opcional)
      description: Archivos, endpoints, tablas, links a Langfuse/Sentry, decisiones ya tomadas. Sin secretos.
